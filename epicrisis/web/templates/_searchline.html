<form class="searchline" method="get" action="/search" role="search">
  <label class="caps" for="q">Search</label>
  <input id="q" name="q" type="search" value="{{ query or "" }}" placeholder="a word from a document, an institution, the name of a test" autocomplete="off">
  <button class="caps" type="submit">Find</button>
</form>
