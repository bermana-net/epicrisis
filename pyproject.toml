[project]
name = "epicrisis"
version = "0.5.0"
description = "A self-hosted archive: scanned medical documents as structured data, every value as printed."
readme = "README.md"
license = "BUSL-1.1"
license-files = ["LICENSE", "COMMERCIAL.md"]
requires-python = ">=3.14"
dependencies = [
    "cryptography>=50.0.1",
    "fastapi>=0.141.1",
    "jinja2>=3.1.6",
    "markdown-it-py>=4.2.0",
    "mcp>=2.2.0",
    "openpyxl>=3.1.5",
    "pillow>=12.3.0",
    # Two libraries read a PDF here, and which answers which question is decided in one place,
    # epicrisis/readers/pdf.py, where it is also written down. pypdf says what a file *is*:
    # whether it is encrypted and whether the empty password opens it, how many pages it has, and
    # whether a picture is pasted into a page. pdfium reads the text layer of a page and renders a
    # page as a picture. Neither answers a question the other also answers, so they cannot
    # disagree; dropping either one takes a question with it.
    "pypdf>=6.18.1",
    "pypdfium2>=5.13.0",
    "python-docx>=1.2.0",
    "python-magic>=0.4.27",
    "python-multipart>=0.0.32",
    # Draws one picture: the QR of a connector's authenticator URI, in the single answer that
    # shows that code at all. Hand-rolled it is Reed-Solomon, mask selection and version choosing
    # — a few hundred lines whose subtle failure is a code that scans to the wrong secret, so the
    # authenticator never works and nobody can see why. Pure Python, seven modules, nothing of
    # its own to install, and the page draws the URI as text whether or not this is here: a
    # missing drawing library must not take a page down.
    "segno>=1.6.6",
    "typer>=0.16",
    "uvicorn>=0.53.0",
    "xlrd>=2.0.2",
]

[project.scripts]
epicrisis = "epicrisis.cli:run"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=8.4",
    # The suite alone takes minutes and this machine has cores to spare: `pytest -n 4`. Nothing in
    # the suite depends on the order tests run in, and each writes under its own tmp_path.
    "pytest-xdist>=3.6",
    "xlwt>=1.3.0",
]

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[tool.uv]
python-preference = "only-system"
python-downloads = "never"

[tool.uv.build-backend]
module-name = "epicrisis"
module-root = ""

[tool.pytest.ini_options]
testpaths = ["tests"]
