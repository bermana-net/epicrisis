[project]
name = "epicrisis"
version = "0.1.0"
description = "A self-hosted archive: scanned medical documents as structured data, every value as printed."
readme = "README.md"
license = "BUSL-1.1"
license-files = ["LICENSE"]
requires-python = ">=3.14"
dependencies = [
    "cryptography>=50.0.1",
    "fastapi>=0.141.1",
    "jinja2>=3.1.6",
    "markdown-it-py>=4.2.0",
    "mcp>=2.2.0",
    "openpyxl>=3.1.5",
    "pillow>=12.3.0",
    "pypdf>=6.18.1",
    "pypdfium2>=5.13.0",
    "python-docx>=1.2.0",
    "python-magic>=0.4.27",
    "python-multipart>=0.0.32",
    "typer>=0.16",
    "uvicorn>=0.53.0",
    "xlrd>=2.0.2",
]

[project.scripts]
epicrisis = "epicrisis.cli:app"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=8.4",
    "xlwt>=1.3.0",
]

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[tool.uv]
python-preference = "only-system"
python-downloads = "never"

[tool.uv.build-backend]
module-name = "epicrisis"
module-root = ""

[tool.pytest.ini_options]
testpaths = ["tests"]
